name: Backend Deploy 
 
on:
  push:
    branches: [main]
    paths:
     - 'Backend/Terraform/**'
     - 'Backend/**/*.py'
     - 'Backend/**/*.zip'
     - '.github/workflows/backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        TF_VAR_bucket_name: ${{ secrets.TF_VAR_bucket_name }}
        TF_VAR_region: ${{ secrets.TF_VAR_region }}
        TF_VAR_frontend_directory: ${{ secrets.TF_VAR_frontend_directory }}
        TF_VAR_domain_name: ${{ secrets.TF_VAR_domain_name }}
        TF_VAR_zone_id: ${{ secrets.TF_VAR_zone_id}}
        TF_VAR_index_document: ${{ secrets.TF_VAR_index_document}}
        TF_VAR_error_document: ${{ secrets.TF_VAR_error_document}}
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: Backend/Terraform
     

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: Backend/Terraform

      - name: Debug Env Vars
        run:
          echo "Region: $TF_VAR_region"

      - name: Terraform Plan
        run: terraform plan
        working-directory: Backend/Terraform
        timeout-minutes: 5

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: Backend/Terraform
    